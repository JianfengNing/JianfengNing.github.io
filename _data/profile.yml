bio: >-
  I am a postdoctoral researcher in the Nonsmooth Variational Problems and
  Operator Equations group at the Weierstrass Institute in Berlin. My work
  connects mathematical analysis, numerical algorithms, and scientific machine
  learning to solve inverse and PDE-constrained problems.

